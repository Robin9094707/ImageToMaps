# ┌──────────────────────────────────────────────────────────────────────────────┐
# │  Simplex ImageToMap – images, GIFs, custom blocks & 3D models (Java+Bedrock) │
# └──────────────────────────────────────────────────────────────────────────────┘
# Language: players with a German client see German, everyone else English.
# The console uses:
console-language: en
# Copy example blocks, models and images on the first start.
install-examples: true

ui:
  # Native Bedrock forms (Floodgate or Geyser required). Java players get chest menus and dialogs.
  bedrock-forms: true

images:
  # Watch plugins/SimplexImageToMap/images/ and refresh displays automatically when a file changes.
  auto-refresh: true
  max-download-mb: 25

placement:
  default-width: 3
  max-size: 16
  range: 48
  default-fit: FIT          # FIT | FILL | STRETCH
  default-style: INVISIBLE  # INVISIBLE | NORMAL | GLOW_INVISIBLE | GLOW
  default-dither: true

animation:
  # Max frames decoded per GIF (memory: frames × maps × 16 KB).
  max-frames: 400
  # Only players within this distance receive animation updates.
  view-distance: 64
  # Frame rate caps. Bedrock clients are slower at applying map updates, so they get fewer frames.
  java-max-fps: 20
  bedrock-max-fps: 10
  # Full resync interval (heals packet loss / late joiners).
  keyframe-seconds: 8

custom-blocks:
  # The custom block module. Disabling it removes blocks from the packs and stops placing them.
  enabled: true

models:
  enabled: true
  # Show a live hologram (Java) / particle box (Bedrock) of the model you are about to place.
  ghost-preview: true
  view-range: 96

resource-pack:
  # Built-in web server hosting the generated packs (Java + Bedrock). Open this TCP port on your host!
  web-server:
    enabled: true
    bind: 0.0.0.0
    port: 8163
  # Host name / IP players use to download the pack. Empty = the address the player connected with.
  public-host: ""
  # Port players use (if you forward a different external port).
  public-port: 8163
  # Use an external web server / CDN instead (upload the files from generated/java/ there).
  external-url: ""
  send-on-join: true
  join-delay-ticks: 20
  # Push the new pack live to all Java players whenever blocks/models/sounds change.
  push-on-change: true
  required: false
  java-pack-format: 75
  description: "§bSimplex §7Custom Content"

# Feedback sounds. Set sound to "none" to disable one.
sounds:
  click: {sound: minecraft:ui.button.click, volume: 0.4, pitch: 1.2}
  menu-open: {sound: minecraft:block.amethyst_block.chime, volume: 0.6, pitch: 1.4}
  success: {sound: minecraft:entity.player.levelup, volume: 0.5, pitch: 1.6}
  error: {sound: minecraft:entity.villager.no, volume: 0.7, pitch: 1.0}
  place-confirm: {sound: minecraft:entity.item_frame.place, volume: 1.0, pitch: 1.0}
