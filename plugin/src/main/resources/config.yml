# ┌───────────────────────────────────────────────────────────────┐
# │  Simplex ImageToMap – images & animated GIFs on map walls     │
# │  for Java and Bedrock (Geyser / Floodgate)                    │
# └───────────────────────────────────────────────────────────────┘
# Language: players with a German client see German, everyone else English.
# The console uses:
console-language: en
# Copy the example images (poster + animated GIF) on the first start.
install-examples: true

ui:
  # Native Bedrock forms (Floodgate or Geyser required). Java players get chest menus and dialogs.
  bedrock-forms: true

images:
  # Watch plugins/SimplexImageToMap/images/ and refresh displays automatically when a file changes.
  auto-refresh: true
  max-download-mb: 25

placement:
  default-width: 3
  max-size: 16
  range: 48
  default-fit: FIT          # FIT | FILL | STRETCH
  default-style: INVISIBLE  # INVISIBLE | NORMAL | GLOW_INVISIBLE | GLOW
  default-dither: true

displays:
  # Admins can sneak + hit a frame of a display to open its menu (move, change image, remove …).
  sneak-hit-opens-menu: true

animation:
  # Max frames decoded per GIF (memory: frames × maps × 16 KB).
  max-frames: 400
  # Only players within this distance receive animation updates.
  view-distance: 64
  # Frame rate caps. Bedrock clients are slower at applying map updates, so they get fewer frames.
  java-max-fps: 20
  bedrock-max-fps: 10
  # Full resync interval (heals packet loss / late joiners).
  keyframe-seconds: 8

# Feedback sounds. Set sound to "none" to disable one.
sounds:
  click: {sound: minecraft:ui.button.click, volume: 0.4, pitch: 1.2}
  menu-open: {sound: minecraft:block.amethyst_block.chime, volume: 0.6, pitch: 1.4}
  success: {sound: minecraft:entity.player.levelup, volume: 0.5, pitch: 1.6}
  error: {sound: minecraft:entity.villager.no, volume: 0.7, pitch: 1.0}
  place-confirm: {sound: minecraft:entity.item_frame.place, volume: 1.0, pitch: 1.0}
