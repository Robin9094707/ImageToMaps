# Simplex ImageToMap – English (used for every client language except German). MiniMessage format.
prefix: "<gradient:#4fd1ff:#7b5cff><bold>Simplex</bold></gradient> <dark_gray>»</dark_gray> "

help: |-
  <gradient:#4fd1ff:#7b5cff><bold>Simplex ImageToMap</bold></gradient> <gray>– commands</gray>
  <aqua>/sim</aqua> <gray>open the menu (Java: chest & dialogs, Bedrock: native forms)</gray>
  <aqua>/sim place <image> [w] [h]</aqua> <gray>guided placement with live preview</gray>
  <aqua>/sim place cancel</aqua> <gray>· </gray><aqua>/sim place size <w> <h></aqua>
  <aqua>/sim refresh <image|all></aqua> <gray>reload an image file live into all its displays</gray>
  <aqua>/sim download <url> [name]</aqua> <gray>download an image / GIF</gray>
  <aqua>/sim image delete <image></aqua> <gray>delete an image and all its displays</gray>
  <aqua>/sim display <list|info|create|move|style|pause|resume|remove|tp></aqua>
  <aqua>/sim reload</aqua> <gray>· Tip: sneak + hit a frame to edit its display</gray>

reloaded: "<green>Configuration and languages reloaded – images are re-rendered.</green>"
settings.saved: "<green>Settings saved.</green>"

error:
  no-permission: "<red>You are not allowed to do that.</red>"
  player-only: "<red>Only players can do that.</red>"
  player-not-found: "<red>Player not found.</red>"
  number: "<red>Not a valid number: <white><value></white></red>"
  generic: "<red>Something went wrong: <white><error></white></red>"

usage:
  place: "<gray>Usage: <aqua>/sim place <image> [width] [height]</aqua>, <aqua>/sim place cancel</aqua>, <aqua>/sim place size <w> <h></aqua></gray>"
  download: "<gray>Usage: <aqua>/sim download <url> [name]</aqua></gray>"
  display: "<gray>Usage: <aqua>/sim display <list|info|move|style <style>|pause|resume|remove|tp> [id]</aqua></gray>"
  display-create: "<gray>Usage: <aqua>/sim display create <image> <w> <h> <world> <x> <y> <z> <face> [style]</aqua> <dark_gray>(x y z = block the frames hang on)</dark_gray></gray>"
  image: "<gray>Usage: <aqua>/sim image delete <image></aqua></gray>"

frame-style:
  invisible: "<white>Invisible</white>"
  normal: "<white>Visible frame</white>"
  glow-invisible: "<yellow>Glowing · invisible</yellow>"
  glow: "<yellow>Glowing frame</yellow>"

fit-mode:
  fit: "<white>Fit (whole image)</white>"
  fill: "<white>Fill (crop)</white>"
  stretch: "<white>Stretch</white>"

image:
  not-found: "<red>Image <white><image></white> not found in the images folder.</red>"
  invalid: "<red>Could not read the image: <white><error></white></red>"
  refreshed: "<green>Image <white><image></white> refreshed live.</green>"
  refresh-failed: "<red>Image <white><image></white> could not be rendered.</red>"
  refreshed-all: "<green>Re-rendering <white><count></white> displays…</green>"
  not-used: "<yellow>Image <white><image></white> is not used by any display yet.</yellow>"
  downloading: "<gray>Downloading <white><url></white>…</gray>"
  downloaded: "<green>Saved as <white><image></white>.</green> <gray>Use <aqua>/sim place <image></aqua></gray>"
  download-failed: "<red>Download failed: <white><error></white></red>"
  deleted: "<green>Image <white><image></white> deleted (<white><count></white> displays removed). The file is in <gray>trash/images/</gray>.</green>"
  delete-failed: "<red>Image <white><image></white> could not be deleted.</red>"
  displays-removed: "<green>Removed <white><count></white> displays of <white><image></white>.</green>"

placement:
  started: "<green>Guided placement for <white><image></white> (<w>×<h> maps).</green>\n<gray>Look at a wall, floor or ceiling. <white>Right click</white> place · <white>Left click</white> frame style · <white>Sneak + scroll</white> size · <white>F</white> fit mode · <white>Sneak + right click</white> cancel</gray>"
  started-bedrock: "<green>Guided placement for <white><image></white> (<w>×<h> maps).</green>\n<gray>Look at a wall/floor. <white>Tap/use</white> place · <white>Hit</white> frame style · <white>Sneak + change hotbar slot</white> size · <white>Sneak + use</white> cancel</gray>"
  no-target: "<gray>Look at a wall, floor or ceiling…</gray>"
  valid: "<green>✔ Fits!</green> <gray>Right click to place · left click: style · sneak+scroll: size</gray>"
  valid-bedrock: "<green>✔ Fits!</green> <gray>Use to place · hit: style</gray>"
  invalid: "<red>✖ Does not fit</red> <gray>– <white><missing></white> missing support blocks, <white><blocked></white> blocked</gray>"
  cannot-place: "<red>Can not place here: <white><missing></white> missing blocks behind the frames, <white><blocked></white> cells blocked.</red>"
  style-changed: "<gray>Frame style:</gray> <style>"
  fit-changed: "<gray>Fit mode:</gray> <fit>"
  bossbar: "<white><image></white> <dark_gray>|</dark_gray> <aqua><w>×<h></aqua> <gray>maps</gray> <dark_gray>|</dark_gray> <style> <dark_gray>|</dark_gray> <fit>"
  cancelled: "<gray>Placement cancelled.</gray>"
  placed: "<green>Display <white><id></white> placed: <white><image></white> (<w>×<h>).</green>"
  bedrock-invisible-note: "<gray>Note: Bedrock can not show invisible frames – Bedrock players see normal frames.</gray>"

