  <aqua>/sim image delete <bild></aqua> <gray>Bild und alle seine Anzeigen löschen</gray>
  <aqua>/sim display <list|info|create|move|style|pause|resume|remove|tp></aqua>
  <aqua>/sim reload</aqua> <gray>· Tipp: Schleichen + Rahmen schlagen bearbeitet die Anzeige</gray>

