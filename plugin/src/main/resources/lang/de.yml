# Simplex ImageToMap – Deutsch (für alle Clients mit deutscher Sprache). MiniMessage-Format.
prefix: "<gradient:#4fd1ff:#7b5cff><bold>Simplex</bold></gradient> <dark_gray>»</dark_gray> "

help: |-
  <gradient:#4fd1ff:#7b5cff><bold>Simplex ImageToMap</bold></gradient> <gray>– Befehle</gray>
  <aqua>/sim</aqua> <gray>Menü öffnen (Java: Truhe & Dialoge, Bedrock: native Formulare)</gray>
  <aqua>/sim place <bild> [b] [h]</aqua> <gray>geführtes Platzieren mit Live-Vorschau</gray>
  <aqua>/sim place cancel</aqua> <gray>· </gray><aqua>/sim place size <b> <h></aqua>
