name: SimplexImageToMap
version: '${version}'
main: dev.simplex.itm.SimplexPlugin
api-version: '26.2'
description: Images & animated GIFs on map walls with guided placement – for Java and Bedrock (Geyser/Floodgate).
authors: [Simplex]
website: https://github.com/robin9094707/ImageToMaps
softdepend: [floodgate, Geyser-Spigot]

permissions:
  simplex.use:
    description: Use /sim and open the menu
    default: true
  simplex.images:
    description: View the image & display menus
    default: op
  simplex.images.create:
    description: Place, move, refresh and remove displays, download and delete images
    default: op
  simplex.admin:
    description: Everything (settings, reload)
    default: op
    children:
      simplex.use: true
      simplex.images: true
      simplex.images.create: true
